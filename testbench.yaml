providers:
  - Mmoollllee\FilamentBuilderExtensions\FilamentBuilderExtensionsServiceProvider
  - Workbench\App\Providers\AdminPanelProvider

migrations: true

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: /login
  install: true
  discovers:
    web: true
    commands: false
    components: false
    factories: true
    views: true
  build:
    - asset-publish
    - create-sqlite-db
    - migrate-fresh
    - filament-assets
  assets:
    - laravel-assets
